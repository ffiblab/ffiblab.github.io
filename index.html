<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ffiblab</title>
  <meta name="description" content="당신의 모든 순간에, 즐거움 한 스푼. ffiblab은 일상의 도구에 즐거움을 더하는 앱을 만듭니다. A spoonful of delight, in every moment." />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ffiblab.com/" />
  <meta property="og:title" content="ffiblab" />
  <meta property="og:description" content="당신의 모든 순간에, 즐거움 한 스푼. A spoonful of delight, in every moment." />
  <meta property="og:image" content="https://ffiblab.com/assets/og-pensound.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@ffiblab" />
  <meta name="twitter:title" content="ffiblab" />
  <meta name="twitter:description" content="당신의 모든 순간에, 즐거움 한 스푼. A spoonful of delight, in every moment." />
  <meta name="twitter:image" content="https://ffiblab.com/assets/og-pensound.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <style>
    /* ── 페이지 구조 ── */
    .frame {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 clamp(20px, 5vw, 64px);
    }

    /* ── 네비 ── */
    header {
      border-bottom: var(--line) solid var(--border);
      position: relative;
      z-index: 2;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 18px;
      padding-bottom: 18px;
    }
    .nav-mark {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--fg);
      text-decoration: none;
    }
    .nav-mark span { color: var(--accent); }

    /* ── 히어로: 워드마크가 로고다 ── */
    .hero {
      padding-top: clamp(56px, 10vh, 128px);
      padding-bottom: clamp(56px, 10vh, 128px);
      position: relative;
    }
    .wordmark {
      font-size: clamp(72px, 17vw, 208px);
      text-transform: none;   /* 소문자 워드마크 — 유일한 대문자 규칙 예외 */
    }
    .wordmark .dot { color: var(--accent); }
    .tagline {
      margin-top: var(--space-4);
      max-width: 560px;
    }
    .tagline .main {
      font-size: clamp(20px, 2.6vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.35;
    }
    .tagline .sub {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(0,0,0,0.55);
    }

    /* 히어로 우측 기하 구성 — 장식이 아니라 그리드의 표명 (바우하우스식) */
    .hero-geo {
      position: absolute;
      right: clamp(20px, 6vw, 96px);
      top: clamp(56px, 10vh, 128px);
      width: clamp(120px, 20vw, 240px);
      aspect-ratio: 1;
      display: none;
    }
    @media (min-width: 900px) { .hero-geo { display: block; } }
    .hero-geo .sq {
      position: absolute; inset: 0;
      border: var(--line-thick) solid var(--border);
      background: var(--bg);
    }
    .hero-geo .ci {
      position: absolute;
      width: 58%; aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent-bright);
      right: -14%; bottom: -14%;
    }
    /* 두 획이 (62%, 38%)에서 만나 가로로 긴 내부 사각형을 이루고, 그 모서리가 파란 원 위를 지난다.
       읽기: 왼쪽 모서리+가로획 = f, 세로획+가로획 = f, 세로획 = i, 세로획+원 = b → ffib
       (블라인드 10표 중 5표로 선정된 비례) */
    .hero-geo .ln {
      position: absolute;
      left: 62%; top: -12%;
      width: var(--line-thick); height: calc(50% + var(--line-thick));
      background: var(--border);
    }
    .hero-geo .ln-h {
      position: absolute;
      left: -12%; top: 38%;
      width: calc(74% + var(--line-thick)); height: var(--line-thick);
      background: var(--border);
    }

    /* ── 섹션 공통 ── */
    section {
      border-top: var(--line) solid var(--border);
      padding-top: var(--space-4);
      padding-bottom: var(--space-5);
    }
    .sec-head { margin-bottom: var(--space-4); }

    /* ── 제품 카드: 반전 호버 ── */
    .product {
      display: grid;
      grid-template-columns: 96px 1fr auto;
      gap: var(--space-3);
      align-items: center;
      border: var(--line) solid var(--border);
      background: var(--muted);
      padding: var(--space-3);
      text-decoration: none;
      color: var(--fg);
      transition: background 150ms linear, color 150ms linear;
    }
    .product:hover { background: var(--accent); color: #fff; }
    .product:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .product img { width: 96px; height: 96px; display: block; }
    .product h3 {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    .product p {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      color: rgba(0,0,0,0.6);
      transition: color 150ms linear;
    }
    .product:hover p { color: rgba(255,255,255,0.85); }
    .product .os {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      transition: color 150ms linear;
    }
    .product:hover .os { color: #fff; }
    .product .arrow {
      font-size: 32px;
      font-weight: 900;
      transition: transform 150ms ease-out;
    }
    .product:hover .arrow { transform: translateX(6px); }
    @media (max-width: 640px) {
      .product { grid-template-columns: 64px 1fr; }
      .product img { width: 64px; height: 64px; }
      .product .arrow { display: none; }
    }

    /* ── 연락처 ── */
    .contact-mail {
      display: inline-block;
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--fg);
      text-decoration: none;
      border-bottom: 3px solid var(--fg);
      padding-bottom: 2px;
      transition: color 150ms linear, border-color 150ms linear;
    }
    .contact-mail:hover { color: var(--accent); border-color: var(--accent); }

    /* ── 푸터 ── */
    footer {
      border-top: var(--line) solid var(--border);
      font-size: 12px;
      font-weight: 500;
      color: rgba(0,0,0,0.5);
    }
    .foot-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: var(--space-3);
      padding-bottom: var(--space-4);
    }
    footer nav { display: flex; gap: 20px; }
    footer a {
      color: rgba(0,0,0,0.5);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
    }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body class="tx-noise">
  <header>
    <div class="frame nav">
      <a class="nav-mark" href="./">ffiblab<span>.</span></a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="ko" aria-pressed="true">KO</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main>
    <div class="hero tx-grid">
      <div class="frame">
        <h1 class="display wordmark">ffib<br />lab<span class="dot">.</span></h1>
        <div class="tagline">
          <p class="main" data-i18n="tagline"></p>
          <p class="sub" data-i18n="taglineSub"></p>
        </div>
      </div>
      <div class="hero-geo" aria-hidden="true">
        <div class="sq"></div>
        <div class="ln"></div>
        <div class="ln-h"></div>
        <div class="ci"></div>
      </div>
    </div>

    <section id="products">
      <div class="frame">
        <div class="sec-head">
          <span class="sec-label" data-i18n="secProducts"></span>
        </div>
        <a class="product" href="pensound/">
          <img src="assets/pensound-icon.png" alt="" width="96" height="96" />
          <div>
            <h3>PenSound</h3>
            <p data-i18n="pensoundDesc"></p>
            <div class="os">macOS&ensp;·&ensp;<span data-i18n="windowsSoon"></span></div>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <section id="contact">
      <div class="frame">
        <div class="sec-head">
          <span class="sec-label" data-i18n="secContact"></span>
        </div>
        <a class="contact-mail" href="mailto:hello@ffiblab.com">hello@ffiblab.com</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="frame foot-inner">
      <span>© 2026 ffiblab</span>
      <nav>
        <a href="privacy/" data-i18n="privacy"></a>
        <a href="refund/" data-i18n="refund"></a>
      </nav>
    </div>
  </footer>

  <script>
    // ── 한/영 병기 (추후 언어 추가 = STRINGS에 항목 추가) ──
    const STRINGS = {
      ko: {
        tagline: "당신의 모든 순간에,\n즐거움 한 스푼.",
        taglineSub: "A spoonful of delight, in every moment.",
        secProducts: "01 — 제품",
        secContact: "02 — 연락처",
        pensoundDesc: "타블렛에서 사라진 펜 소리를 되찾아주는 앱이에요.",
        windowsSoon: "Windows 준비 중",
        privacy: "개인정보 처리방침",
        refund: "환불 정책",
      },
      en: {
        tagline: "A spoonful of delight,\nin every moment.",
        taglineSub: "당신의 모든 순간에, 즐거움 한 스푼.",
        secProducts: "01 — Products",
        secContact: "02 — Contact",
        pensoundDesc: "The app that brings real pen sounds back to your drawing tablet.",
        windowsSoon: "Windows coming soon",
        privacy: "Privacy",
        refund: "Refund",
      },
    };

    function setLang(lang) {
      const dict = STRINGS[lang] || STRINGS.en;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const v = dict[el.dataset.i18n];
        if (v == null) return;
        el.innerHTML = v.replace(/\n/g, "<br />");   // 태그라인 줄바꿈
      });
      document.querySelectorAll(".lang-toggle button").forEach((b) => {
        b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
      });
      try { localStorage.setItem("ffiblab-lang", lang); } catch (e) {}
    }

    document.querySelectorAll(".lang-toggle button").forEach((b) => {
      b.addEventListener("click", () => setLang(b.dataset.lang));
    });

    let initial = null;
    try { initial = localStorage.getItem("ffiblab-lang"); } catch (e) {}
    if (!initial) initial = (navigator.language || "en").startsWith("ko") ? "ko" : "en";
    setLang(initial);
  </script>
</body>
</html>
