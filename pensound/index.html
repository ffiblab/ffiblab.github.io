<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PenSound — 모든 획에, 소리를.</title>
  <meta name="description" content="디지털 타블렛에 진짜 필기 소리를 되살리는 macOS 앱. 속도·필압·종이결에 반응하는 실시간 합성. Every stroke, a sound." />
  <link rel="icon" type="image/png" href="/assets/pensound-icon.png" />
  <link rel="apple-touch-icon" href="/assets/pensound-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ffiblab.com/pensound/" />
  <meta property="og:title" content="PenSound — 모든 획에, 소리를." />
  <meta property="og:description" content="타블렛에서 사라진 펜 소리를 되살리는 macOS 앱. 속도·필압·종이결에 반응하는 실시간 합성. Every stroke, a sound." />
  <meta property="og:image" content="https://ffiblab.com/assets/og-pensound.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@ffiblab" />
  <meta name="twitter:title" content="PenSound — 모든 획에, 소리를." />
  <meta name="twitter:description" content="타블렛에서 사라진 펜 소리를 되살리는 macOS 앱. Every stroke, a sound." />
  <meta name="twitter:image" content="https://ffiblab.com/assets/og-pensound.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Kalam:wght@400;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="../assets/tokens.css" />
  <style>
    .frame { max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 64px); }

    /* ── 베타 리본 (모집 기간 한정 — 모집 종료 시 이 블록과 <a class="beta-ribbon"> 한 줄만 지우면 원상 복구) ──
       sticky 헤더 '위'에 두고 스크롤과 함께 흘려보낸다 → header의 top:0·JS의 --nav-h 실측이 그대로 유효 */
    .beta-ribbon {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 38px; padding: 8px 20px;
      background: var(--accent); color: #fff;
      font-size: 12.5px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.4;
      text-align: center; text-decoration: none;
    }
    .beta-ribbon:hover { background: var(--fg); }
    .beta-ribbon:focus-visible { outline: 2px solid var(--fg); outline-offset: -4px; }

    /* ── 네비 ── */
    header { border-bottom: var(--line) solid var(--border); position: sticky; top: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); z-index: 20; }
    .nav { display: flex; align-items: center; gap: 18px; padding-top: 14px; padding-bottom: 14px; }
    .nav-mark { font-size: 15px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg); text-decoration: none; }
    .nav-mark span { color: var(--accent); }
    .nav-home { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: rgba(0,0,0,0.45); text-decoration: none; text-transform: uppercase; }
    .nav-home:hover { color: var(--accent); }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .nav .btn { min-height: 38px; padding: 0 18px; font-size: 12px; }

    /* ── 히어로: 비대칭 5:7 ── */
    .hero { padding-top: clamp(40px, 7vh, 88px); padding-bottom: clamp(48px, 8vh, 104px); }
    .hero-grid { display: grid; grid-template-columns: 5fr 7fr; gap: clamp(24px, 4vw, 64px); align-items: center; }
    @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } }

    .hero h1 { font-size: clamp(44px, 6.5vw, 84px); text-transform: none; }
    .hero h1 .dot { color: var(--accent); }
    .hero .lede { margin-top: var(--space-3); font-size: clamp(15px, 1.6vw, 18px); font-weight: 500; line-height: 1.6; color: rgba(0,0,0,0.65); max-width: 420px; }
    .hero .cta-row { margin-top: var(--space-4); display: flex; gap: 14px; flex-wrap: wrap; }

    /* 스케치 포인트: 손글씨 힌트 + 손그림 화살표 (그림 앱의 정체성 — 여기서만) */
    .sketch-hint { position: relative; margin-top: var(--space-4); height: 44px; display: none; }
    @media (min-width: 900px) { .sketch-hint { display: block; } }
    /* EN=Kalam / KO=Gaegu (한글 손글씨 — 순정 산세리프가 손그림 화살표와 안 어울려서) */
    .sketch-hint .hand { font-family: "Kalam", "Gaegu", cursive; font-size: 18px; color: #2d2d2d; transform: rotate(-2.5deg); display: inline-block; }
    html[lang="ko"] .sketch-hint .hand { font-size: 21px; }
    .sketch-hint svg { position: absolute; left: 150px; top: -14px; overflow: visible; }

    /* ── 소리 데모 패널: 종이 은유, 스위스-플랫 (그림자 없음) ── */
    .demo-panel {
      background: var(--muted);
      border: var(--line) solid var(--border);
      padding: 16px;
    }
    /* 그리기 영역 = 종이 시트 (밝은 바탕 + 어두운 잉크 — 페이지의 '종이' 서사와 연결) */
    .paper-screen {
      background: var(--bg);
      border: var(--line) solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .paper-screen canvas { display: block; width: 100%; height: 300px; touch-action: none; cursor: crosshair; }
    .paper-screen .placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: rgba(0,0,0,0.4);
      pointer-events: none; transition: opacity 300ms ease-out;
    }
    /* 지우기 버튼 — 잉크가 있을 때만 나타남 */
    .paper-clear {
      position: absolute; top: 9px; right: 9px; z-index: 3;
      appearance: none; cursor: pointer;
      border: var(--line) solid var(--border); background: var(--bg); color: var(--fg);
      font-family: var(--font-sans); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 5px 10px;
      opacity: 0; pointer-events: none;
      transition: opacity 180ms linear, background 150ms linear, color 150ms linear;
    }
    .paper-screen.has-ink .paper-clear { opacity: 1; pointer-events: auto; }
    .paper-clear:hover { background: var(--fg); color: var(--bg); }
    /* 소리 잠금 해제 칩 — 오디오 컨텍스트가 잠긴 채 획이 끝났을 때만 나타남 */
    .paper-sound {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3;
      display: flex; align-items: center; gap: 7px;
      appearance: none; cursor: pointer;
      border: var(--line) solid var(--fg); background: var(--bg); color: var(--fg);
      font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      padding: 9px 14px;
      animation: sound-nudge 1.6s ease-in-out infinite;
    }
    .paper-sound[hidden] { display: none; }
    .paper-sound svg { width: 14px; height: 14px; }
    .paper-sound:hover { background: var(--fg); color: var(--bg); }
    @keyframes sound-nudge {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) { .paper-sound { animation: none; } }
    /* 도구 선택 — 세그먼트 컨트롤 (lang-toggle와 같은 언어) */
    .demo-tools { margin-top: 14px; display: flex; justify-content: center; }
    .demo-toolset { display: inline-flex; border: var(--line) solid var(--border); }
    .demo-tool {
      appearance: none; border: 0; cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      background: var(--bg); color: var(--fg);
      font-family: var(--font-sans); font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
      padding: 9px 18px;
      transition: background 150ms linear, color 150ms linear;
    }
    .demo-tool + .demo-tool { border-left: var(--line) solid var(--border); }
    .demo-tool:hover:not([aria-pressed="true"]) { background: var(--muted); }
    .demo-tool[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
    .demo-tool:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .demo-tool .glyph { width: 19px; height: 19px; }
    .demo-note {
      margin-top: 12px; text-align: center;
      font-size: 11px; font-weight: 500; color: rgba(0,0,0,0.5);
    }

    /* ── 섹션 공통 ── */
    section { border-top: var(--line) solid var(--border); padding-top: var(--space-4); padding-bottom: var(--space-5); }
    .sec-head { margin-bottom: var(--space-4); display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap; }
    .sec-head h2 { font-size: clamp(24px, 3.4vw, 40px); font-weight: 900; letter-spacing: -0.02em; }

    /* ── 02 작동 원리: 3열 카드 ── */
    .how-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
    @media (max-width: 820px) { .how-grid { grid-template-columns: 1fr; } }
    .how-card {
      border: var(--line) solid var(--border);
      background: var(--muted);
      padding: var(--space-3);
      min-height: 200px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
      transition: background 150ms linear, color 150ms linear;
    }
    .how-card:hover { background: var(--fg); color: #fff; }
    .how-card:hover .how-num { color: #fff; }
    .how-card .how-num { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); transition: color 150ms linear; }
    .how-card h3 { font-size: 20px; font-weight: 900; letter-spacing: -0.01em; margin-bottom: 8px; }
    .how-card p { font-size: 13.5px; font-weight: 500; line-height: 1.6; opacity: 0.75; }

    /* ── 03 팔레트 목업 (스크린샷 대신 코드로 — 항상 crisp, 언어 연동) ── */
    .palette-grid { display: grid; grid-template-columns: 7fr 5fr; gap: clamp(24px, 4vw, 64px); align-items: start; }
    @media (max-width: 900px) { .palette-grid { grid-template-columns: 1fr; } }
    .palette-desc h3 { font-size: clamp(20px, 2.6vw, 28px); font-weight: 900; letter-spacing: -0.01em; margin-bottom: 14px; }
    .palette-desc p { font-size: 14.5px; font-weight: 500; line-height: 1.7; color: rgba(0,0,0,0.65); margin-bottom: 12px; }
    /* 차별 기능 강조 블록 (홀드 뮤트 / 필압 감도·커브) */
    .feats { margin-top: 22px; }
    .feat { position: relative; padding: 14px 0 14px 24px; min-height: 52vh; display: flex; flex-direction: column; justify-content: center; }  /* 스텝당 체류 시간 — 목업 연출을 볼 여유 */
    /* 활성 설명 옆에서 자라나는 강조 바 (스크롤에 반응) */
    .feat::before {
      content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 0; background: var(--accent); opacity: 0;
      transition: height 320ms cubic-bezier(0.4,0,0.2,1), opacity 320ms linear;
    }
    .feat.is-active::before { height: 52px; opacity: 1; }
    .feat b {
      display: block;
      font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .feat b::before { content: "→ "; color: var(--accent); font-weight: 900; }
    .feat span { font-size: 13.5px; font-weight: 500; line-height: 1.65; color: rgba(0,0,0,0.6); }

    .mock-stage { background: var(--muted); border: var(--line) solid var(--border); padding: clamp(24px, 4vw, 56px); display: flex; justify-content: center; }

    /* ── 메뉴바 장면: '메뉴바에 사는 도구'를 그대로 보여준다 (메뉴바 + 커서 클릭 → 팔레트 드롭) ── */
    .mock-scene { width: min(100%, 340px); position: relative; }
    .mock-menubar {
      display: flex; align-items: center; justify-content: flex-end; gap: 3px;
      height: 27px; padding: 0 10px;
      background: #FBFBFD; color: #1d1d1f;
      border: 1px solid rgba(0,0,0,0.12); border-radius: 7px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      font-family: var(--font-sans);
    }
    .mb-item { display: inline-flex; align-items: center; justify-content: center; height: 21px; padding: 0 6px; border-radius: 5px; }
    .mb-item svg { width: 14px; height: 14px; }
    .mb-dim { opacity: 0.66; }
    .mb-clock { font-size: 10.5px; font-weight: 600; padding-left: 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    /* 클릭 눌림 하이라이트 — 팔레트가 열려 있는 동안 유지 (macOS와 동일) */
    .mock-scene.mb-pressed .mb-app { background: rgba(0,0,0,0.14); }

    /* 팔레트 열림/닫힘 — 메뉴바 아이콘 지점에서 펼쳐진다 */
    .mock-scene .mock {
      margin-top: 10px;
      transform-origin: 57% top;
      transition: opacity 200ms ease-out, transform 260ms cubic-bezier(0.2, 0.8, 0.3, 1.12);
    }
    .mock-scene:not(.is-open) .mock { opacity: 0; transform: translateY(-10px) scale(0.94); }

    /* macOS 화살표 커서 — JS가 transform으로 이동시킨다 */
    .mock-cursor {
      position: absolute; left: 0; top: 0; width: 21px; height: 21px; z-index: 4;
      opacity: 0; pointer-events: none;
      transition: transform 720ms cubic-bezier(0.3, 0.7, 0.2, 1), opacity 180ms linear;
    }
    .mock-scene.cursor-visible .mock-cursor { opacity: 1; }

    .mock {
      width: 290px; background: #F4F4F6; border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.12);
      box-shadow: 0 18px 40px rgba(0,0,0,0.16);
      font-family: var(--font-sans);
      padding: 8px 10px 10px;
      color: #1d1d1f;
    }
    .mock-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 8px; }
    .mock-dot { width: 8px; height: 8px; border-radius: 50%; background: #34C759; }
    .mock-head .sp { flex: 1; }
    .mock-head svg { width: 13px; height: 13px; color: rgba(0,0,0,0.42); }
    .mock-card { background: rgba(255,255,255,0.72); border-radius: 9px; padding: 10px; }
    .mock-card + .mock-card { margin-top: 8px; }
    .mock-cap {
      height: 22px; border-radius: 11px; background: rgba(0,0,0,0.10);
      box-shadow: inset 0 0.5px 1.5px rgba(0,0,0,0.08);
      position: relative; overflow: hidden;
    }
    .mock-cap + .mock-cap { margin-top: 8px; }
    .mock-cap .fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: #fff; border-radius: 11px;
      /* 선명한 윤곽선 + 약한 그림자 — 흰 배경 위 흰 게이지의 구분감 */
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.22), 0 0.5px 1px rgba(0,0,0,0.08);
      width: 55%;
      transition: width 900ms ease-in-out;
    }
    .mock-cap svg { position: absolute; left: 8px; top: 4px; width: 14px; height: 14px; opacity: 0.55; }
    .mock-cap .val { position: absolute; right: 9px; top: 4.5px; font-size: 9px; color: rgba(0,0,0,0.5); font-variant-numeric: tabular-nums; }
    /* 커브 슬라이더 — 중앙(0)에서 양쪽으로 자라는 게이지. 가운데 눈금 = 0점 */
    .mock-cap.cap-center::after {
      content: ""; position: absolute; left: calc(50% - 0.5px); top: 5px; bottom: 5px;
      width: 1px; background: rgba(0,0,0,0.25);
    }
    /* 양수·음수 fill을 중앙에 각각 고정하고 width만 움직인다 —
       한 장으로 left까지 옮기면 부호가 바뀔 때 블록이 중앙을 가로질러 미끄러진다 */
    .mock-cap .fill.fill-curve-pos {
      left: 50%;
      border-radius: 0 11px 11px 0;   /* 바깥쪽만 트랙 곡률로 둥글게 — 중앙(0점)은 눈금에 붙는 평면 */
    }
    .mock-cap .fill.fill-curve-neg {
      left: auto; right: 50%;
      border-radius: 11px 0 0 11px;
    }
    .mock-tools { display: flex; justify-content: space-between; padding: 6px 4px; }
    .mock-tool { width: 40px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #3a4046; transition: background 300ms, color 300ms; }
    .mock-tool svg { width: 17px; height: 17px; }
    .mock-tool.sel { background: rgba(37,99,235,0.13); color: #2563EB; }
    .mock-sec { font-size: 9.5px; font-weight: 600; color: rgba(0,0,0,0.45); padding: 8px 4px 6px; }

    /* ── 03 설명 ↔ 목업 연동 (스크롤에 따라 고정 목업이 반응) ── */
    .mock { position: relative; }                 /* hush-cue 앵커 */
    /* 스테이지 실측 높이(--stage-h, JS가 채움) 기준 뷰포트 세로 중앙 — 낮은 화면에선 위 여백 20px 확보 */
    .mock-stage { position: sticky; top: max(20px, calc((100vh - var(--stage-h, 430px)) / 2)); align-self: start; }
    .feat { transition: opacity 200ms linear; }
    .feat[data-feat] { outline: none; }
    .feat b { transition: color 150ms linear; }
    .feats.has-active .feat:not(.is-active) { opacity: 0.42; }
    .feat.is-active b::before { color: var(--accent); }
    .feat[data-feat]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    /* 하이라이트 대상 */
    [data-region] { outline: 2px solid transparent; outline-offset: 4px; border-radius: 4px;
                    transition: outline-color 280ms cubic-bezier(0.4,0,0.2,1), background 280ms cubic-bezier(0.4,0,0.2,1); }
    .mock.focus-tools [data-region="tools"],
    .mock.focus-curve [data-region="curve"] { outline-color: var(--accent); background: rgba(37,99,235,0.06); }
    .mock .card-vol { transition: opacity 200ms linear; }
    .mock.is-focusing .card-vol { opacity: 0.4; }

    /* 홀드 뮤트 큐 — 목업 위에 'Space 누르면 조용히' */
    .hush-cue {
      position: absolute; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      background: rgba(244,244,246,0.82);
      opacity: 0; pointer-events: none; transition: opacity 200ms linear;
    }
    .mock.focus-mute .hush-cue { opacity: 1; }
    .hush-cue svg { width: 20px; height: 20px; color: var(--fg); }
    .hush-cue kbd {
      font-family: var(--font-sans); font-size: 12px; font-weight: 700;
      border: var(--line) solid var(--border); background: var(--bg); color: var(--fg);
      padding: 5px 11px; line-height: 1;
    }
    .hush-cue span { font-size: 12px; font-weight: 600; color: rgba(0,0,0,0.7); }

    /* ── 02 팔레트: 모바일 스크롤리텔링 ──
       화면 위쪽에 섹션 헤드 고정 → 그 아래 목업 고정 → 설명 텍스트는 목업 뒤로
       스크롤되며 사라진다. --nav-h / --sec-h 는 JS가 실측해 채운다. */
    @media (max-width: 900px) {
      /* 제목-목업 사이 숨 쉬는 간격 — 뷰포트 가로·세로에 비례 (작은 폰은 좁게, 큰 폰·태블릿은 넉넉히) */
      #palette { --pal-gap: clamp(12px, 2vh + 1.2vw, 44px); }
      /* 섹션 헤드(02 — 팔레트)를 메인 네비 바로 아래에 고정 */
      #palette .sec-head {
        position: sticky;
        top: var(--nav-h, 92px);
        z-index: 6;
        margin-bottom: var(--pal-gap);
        padding: clamp(10px, 1.5vh, 18px) 0;
        background: rgba(255,255,255,0.94);
        backdrop-filter: blur(12px);
      }
      /* 제목-목업 간격의 가림막 — sticky로 겹칠 때 그 틈으로 지나가는 텍스트를 숨긴다 */
      #palette .sec-head::after {
        content: "";
        position: absolute; left: 0; right: 0; top: 100%;
        height: var(--pal-gap);
        background: var(--bg);
        pointer-events: none;
      }
      /* 목업 스테이지를 섹션 헤드 아래(간격만큼 띄워)에 고정 + 텍스트보다 위로(z) 올려 뒤로 지나가게 */
      #palette .mock-stage {
        position: sticky;
        top: calc(var(--nav-h, 92px) + var(--sec-h, 64px) + var(--pal-gap));
        z-index: 5;
        padding: 16px;
      }
      /* 목업 아래 페이드 존 — 텍스트가 목업 밑으로 들어가며 흐려진다.
         기준이 패딩 박스라 스테이지 자신의 아래 테두리를 덮어버리므로 border만큼 내려서 시작 */
      #palette .mock-stage::after {
        content: "";
        position: absolute;
        left: calc(-1 * var(--line)); right: calc(-1 * var(--line));
        bottom: calc(-64px - var(--line));
        height: 64px;
        background: linear-gradient(to bottom, var(--bg) 12%, rgba(255,255,255,0));
        pointer-events: none;
      }
      /* 설명 블록은 목업 뒤(z 아래)로 흐른다 —
         첫 제목이 목업 아래 페이드 존(64px)에 가려진 채 시작하지 않게 그만큼 내려서 출발 */
      #palette .palette-desc { position: relative; z-index: 1; padding-top: 72px; }
      /* 모바일에선 강조 바가 필요 이상으로 커서 축소 — 대신 스텝당 체류는 데스크톱처럼 넉넉히 */
      #palette .feat { min-height: 44vh; }

    function setLang(lang) {
      const dict = STRINGS[lang] || STRINGS.en;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const v = dict[el.dataset.i18n];
        if (v != null) el.textContent = v;
      });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        const v = dict[el.dataset.i18nHtml];
        if (v != null) el.innerHTML = v;
      });
      document.querySelectorAll(".lang-toggle button").forEach((b) => {
        b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
      });
      // JS가 직접 그리는 라벨(목업 도구 이름·필압 프리셋)도 갱신되도록 알림
      document.dispatchEvent(new CustomEvent("ffiblab:langchange"));
      try { localStorage.setItem("ffiblab-lang", lang); } catch (e) {}
    }
    document.querySelectorAll(".lang-toggle button").forEach((b) => {
      b.addEventListener("click", () => setLang(b.dataset.lang));
    });
    let initial = null;
    try { initial = localStorage.getItem("ffiblab-lang"); } catch (e) {}
    if (!initial) initial = (navigator.language || "en").startsWith("ko") ? "ko" : "en";
    setLang(initial);

    /* ══════════ 사운드 데모 ══════════
       실제 합성 엔진(오프라인 하네스)으로 렌더한 3단 속도 루프를
       드래그 속도에 따라 게인 크로스페이드 — 웹에서 합성하지 않으므로
       데모 음질 = 앱 음질. 탭은 착지 순간 원샷. */
    (function () {
      const canvas = document.getElementById("demoCanvas");
      const placeholder = document.getElementById("demoPlaceholder");
      const screen = document.querySelector(".paper-screen");
      const clearBtn = document.getElementById("demoClear");
      const soundChip = document.getElementById("demoSound");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let ctx2d = null, W = 0, H = 0;

      function fitCanvas() {
        const r = canvas.getBoundingClientRect();
        W = r.width; H = r.height;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx2d = canvas.getContext("2d");
        ctx2d.scale(dpr, dpr);
        ctx2d.lineCap = "round";
        ctx2d.lineJoin = "round";
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);

      let ac = null;              // AudioContext (첫 제스처에서 생성 — 자동재생 정책)
      let masterGain = null;      // 데모 전체 볼륨 — 배경음답게, 통상적인 음악 재생보다 작게
      const DEMO_MASTER = 0.4;
      let currentTool = "pen";
      const bufferCache = {};     // { tool: {slow,mid,fast,taps:[...]}}
      let voices = null;          // {slow:{src,gain}, ...}
      let drawing = false;
      let lastPt = null, lastT = 0, speedEma = 0;
      let audioUnlocked = false;

      // 📱 모바일(iOS 등): 오디오 출력은 사용자 제스처 '안에서' 동기적으로 한 번 울려야 열린다.
      // decodeAudioData(비동기) 뒤에 첫 소리를 내면 이미 제스처 밖이라 무음 처리되므로,
      // 여기서 1-프레임 무음 버퍼를 즉시 재생해 컨텍스트를 강제로 깨운다.
      // ?audiodebug=1 — 모바일에서 컨텍스트 상태를 눈으로 확인하기 위한 임시 배지
      const dbgEl = /[?&]audiodebug=1/.test(location.search) ? (() => {
        const el = document.createElement("div");
        el.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:99;background:#000;color:#0f0;font:11px monospace;padding:4px 8px;pointer-events:none;";
        document.body.appendChild(el);
        return el;
      })() : null;
      const dbg = (m) => { if (dbgEl) dbgEl.textContent = m + (ac ? " | " + ac.state : " | no-ctx"); };

      function unlockAudio() {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = ac.createGain();
          masterGain.gain.value = DEMO_MASTER;
          masterGain.connect(ac.destination);
          // 잠금이 풀리는 순간 — 아직 그리는 중이면 그 자리에서 바로 소리 시작
          ac.onstatechange = () => {
            dbg("statechange");
            if (ac.state === "running" && drawing && !voices) startVoices();
            updateSoundChip();
          };
        }
        // suspended뿐 아니라 iOS 특유의 interrupted 상태도 커버.
        // 유효 제스처 밖이면 resume이 조용히 거부될 수 있어 매 제스처마다 다시 부른다.
        if (ac.state !== "running") {
          const p = ac.resume();
          if (p && p.catch) p.catch(() => {});
        }
        if (audioUnlocked && ac.state === "running") return;
        try {
          const b = ac.createBuffer(1, 1, 22050);
          const s = ac.createBufferSource();
          s.buffer = b;
          s.connect(ac.destination);
          s.start(0);
          audioUnlocked = true;
        } catch (e) {}
      }

      // iOS 사파리는 pointerdown(터치 시작) 제스처로는 컨텍스트를 안 풀어주는 경우가 있다.
      // (도구 버튼부터 소리가 났던 이유 — click은 touchend 이후라 통과)
      // 그래서 아무 곳이든 손을 떼는 순간마다 재시도하고, 실제 running이 되면 물러난다.
      function retryUnlock() {
        unlockAudio();
        dbg("retry-unlock");
        if (ac && ac.state === "running") {
          ["touchstart", "touchend", "pointerup", "click"].forEach((ev) => document.removeEventListener(ev, retryUnlock, true));
        }
      }
      ["touchstart", "touchend", "pointerup", "click"].forEach((ev) => document.addEventListener(ev, retryUnlock, true));

      // ⚠️ file://로 직접 열면 브라우저가 fetch를 차단해 소리가 안 남 — http(s)로 확인할 것
      if (location.protocol === "file:") {
        console.warn("[PenSound demo] file://에서는 오디오 fetch가 차단됩니다. localhost 서버나 배포 주소로 열어주세요.");
      }
      async function loadTool(tool) {
        if (bufferCache[tool]) return bufferCache[tool];
        try {
          const names = ["slow", "mid", "fast", "tap1", "tap2", "tap3", "tap4"];
          const bufs = await Promise.all(names.map(async (n) => {
            const res = await fetch(`audio/${tool}_${n}.m4a`);
            const ab = await res.arrayBuffer();
            return ac.decodeAudioData(ab);
          }));
          const entry = { slow: bufs[0], mid: bufs[1], fast: bufs[2], taps: bufs.slice(3) };
          bufferCache[tool] = entry;
          return entry;
        } catch (err) {
          console.warn("[PenSound demo] 오디오 로드 실패 — 잉크만 동작합니다:", err);
          dbg("load-fail " + (err && err.name));
          return null;
        }
      }

      function stopVoices() {
        if (!voices) return;
        const t = ac.currentTime;
        for (const k of ["slow", "mid", "fast"]) {
          voices[k].gain.gain.setTargetAtTime(0, t, 0.04);
          voices[k].src.stop(t + 0.4);
        }
        voices = null;
      }

      async function startVoices() {
        const bufs = await loadTool(currentTool);
        if (!bufs || !drawing || voices) return;   // 로드 실패/로딩 중 손 뗌 → 시작 안 함
        voices = {};
        for (const k of ["slow", "mid", "fast"]) {
          const src = ac.createBufferSource();
          src.buffer = bufs[k];
          src.loop = true;
          src.loopStart = 0;
          src.loopEnd = bufs[k].duration;
          const gain = ac.createGain();
          gain.gain.value = 0;
          src.connect(gain).connect(masterGain);
          src.start(0, Math.random() * bufs[k].duration);   // 위상 랜덤 — 반복감 방지
          voices[k] = { src, gain };
        }
      }

      function updateGains() {
        if (!voices) return;
        // speedEma: 0(정지)~1(고속). 3-레이어 등파워 크로스페이드
        const s = Math.min(1, speedEma);
        const wSlow = Math.max(0, 1 - s * 2.2);
        const wFast = Math.max(0, (s - 0.55) * 2.2);
        const wMid = Math.max(0, 1 - wSlow - wFast * 0.7);
        const master = drawing ? Math.min(1.1, 0.3 + s * 0.9) : 0;   // 정규화된 소스(-6dB 피크) 기준
        const t = ac.currentTime;
        voices.slow.gain.gain.setTargetAtTime(wSlow * master * 0.9, t, 0.06);
        voices.mid.gain.gain.setTargetAtTime(wMid * master, t, 0.06);
        voices.fast.gain.gain.setTargetAtTime(wFast * master * 1.1, t, 0.06);
      }

      function playTap() {
        const bufs = bufferCache[currentTool];
        if (!bufs) return;
        const src = ac.createBufferSource();
        src.buffer = bufs.taps[1 + Math.floor(Math.random() * 2)];  // 중간 필압 탭
        const g = ac.createGain();
        g.gain.value = 0.9;
        src.connect(g).connect(masterGain);
        src.start();
      }

      /* 잉크: 도구별로 다른 질감 (펜 = 얇고 매끈, 크레용 = 굵고 파랗고 왁스 그레인) */
      const INK = { pen: "#1B1F26", crayon: "#2C5CD6" };   // 크레용 = 파란색(왁스 느낌)

      // 펜: 속도에 따라 가늘어지는 매끈한 선
      function inkPen(from, to, speed) {
        ctx2d.strokeStyle = INK.pen;
        ctx2d.globalAlpha = 0.9;
        ctx2d.lineWidth = Math.max(1.2, 4.2 - speed * 3);
        ctx2d.beginPath();
        ctx2d.moveTo(from.x, from.y);
        ctx2d.lineTo(to.x, to.y);
        ctx2d.stroke();
      }

      // 크레용: 굵은 반투명 심지 + 종이결이 비치는 왁스 그레인, 거친 가장자리
      function inkCrayon(from, to, speed) {
        const dx = to.x - from.x, dy = to.y - from.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;          // 진행방향 수직 단위벡터
        const w = Math.max(5, 11 - speed * 4);        // 크레용은 굵게 (빠르면 약간 얇게)
        // 1) 부드러운 심지 — 반투명이라 겹칠수록 진해짐
        ctx2d.strokeStyle = INK.crayon;
        ctx2d.globalAlpha = 0.4;
        ctx2d.lineWidth = w;
        ctx2d.beginPath();
        ctx2d.moveTo(from.x, from.y);
        ctx2d.lineTo(to.x, to.y);
        ctx2d.stroke();
        // 2) 왁스 그레인 — 심지 폭을 넘나드는 작은 점들이 거친 질감·비침을 만든다
        ctx2d.fillStyle = INK.crayon;
        const grains = Math.max(5, Math.round(len * 2.2));
        for (let i = 0; i < grains; i++) {
          const t = Math.random();
          const off = (Math.random() - 0.5) * w * 1.35;      // 심지 밖까지 튀는 거친 가장자리
          const gx = from.x + dx * t + nx * off;
          const gy = from.y + dy * t + ny * off;
          ctx2d.globalAlpha = 0.1 + Math.random() * 0.32;
          const r = 0.4 + Math.random() * 1.3;
          ctx2d.beginPath();
          ctx2d.arc(gx, gy, r, 0, Math.PI * 2);
          ctx2d.fill();
        }
        ctx2d.globalAlpha = 1;
      }

      function ink(from, to, speed) {
        if (currentTool === "crayon") inkCrayon(from, to, speed);
        else inkPen(from, to, speed);
        screen.classList.add("has-ink");   // 잉크가 생기면 지우기 버튼 표시
      }

      function pt(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      canvas.addEventListener("pointerdown", async (e) => {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        unlockAudio();   // 제스처 안에서 즉시 오디오 잠금 해제 (모바일 필수 — await 전에 호출)
        drawing = true;
        lastPt = pt(e); lastT = performance.now(); speedEma = 0;
        placeholder.style.opacity = "0";
        dbg("pointerdown");
        await loadTool(currentTool);
        playTap();
        await startVoices();
        dbg("voices " + (voices ? "on" : "off"));
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!drawing || !lastPt) return;
        const p = pt(e);
        const now = performance.now();
        const dt = Math.max(1, now - lastT);
        const dist = Math.hypot(p.x - lastPt.x, p.y - lastPt.y);
        const v = Math.min(1, (dist / dt) / 1.4);   // px/ms 정규화
        speedEma += (v - speedEma) * 0.25;
        ink(lastPt, p, speedEma);
        lastPt = p; lastT = now;
        updateGains();
      });

      // 터치 기기는 첫 획이 무음이 되기 쉬우니(iOS: 드래그로는 잠금 해제 안 됨) 처음부터 칩 표시.
      // 오디오가 실제로 running이 되면 숨긴다 — 탭(click)은 iOS에서 확실히 잠금을 푼다.
      const coarsePointer = matchMedia("(pointer: coarse)").matches;
      function updateSoundChip() {
        soundChip.hidden = ac ? ac.state === "running" : !coarsePointer;
      }
      updateSoundChip();

      function end() {
        if (!drawing) return;
        drawing = false;
        speedEma = 0;
        if (voices && ac) {
          const t = ac.currentTime;
          for (const k of ["slow", "mid", "fast"]) voices[k].gain.gain.setTargetAtTime(0, t, 0.05);
          const v = voices; voices = null;
          setTimeout(() => { try { for (const k of ["slow","mid","fast"]) v[k].src.stop(); } catch (e) {} }, 500);
        }
        updateSoundChip();
      }
      canvas.addEventListener("pointerup", end);
      canvas.addEventListener("pointercancel", end);
      canvas.addEventListener("pointerleave", end);

      clearBtn.addEventListener("click", function () {
        end();
        ctx2d.clearRect(0, 0, W, H);
        screen.classList.remove("has-ink");
        placeholder.style.opacity = "1";
      });

      soundChip.addEventListener("click", async () => {
        unlockAudio();   // click 제스처 안 — 여기서의 resume은 iOS에서도 통과한다
        dbg("chip-click");
        await loadTool(currentTool);
        if (ac && ac.state === "running") { playTap(); updateSoundChip(); }
        // 아직 suspended면 statechange가 러닝 전환 시점에 칩을 숨긴다
      });

      // 무소식 감쇠 (이벤트가 안 오면 속도 하강 — 앱과 같은 원리)
      setInterval(() => {
        if (drawing && performance.now() - lastT > 90) {
          speedEma *= 0.75;
          updateGains();
        }
      }, 60);

      // 도구 전환
      document.querySelectorAll(".demo-tool").forEach((b) => {
        b.addEventListener("click", async () => {
          document.querySelectorAll(".demo-tool").forEach((x) => x.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", "true");
          currentTool = b.dataset.tool;
          end();
          unlockAudio();
          await loadTool(currentTool);
          playTap();   // 전환 피드백 = 그 도구의 탭 소리
        });
      });
    })();

    /* ══════════ 팔레트: 스크롤 스크롤리텔링 ══════════
       목업은 스티키로 고정, 각 설명이 뷰포트 중앙선을 지날 때 해당 부분을 활성화.
       데스크톱·모바일 동일하게 스크롤로 구동. key: mute | curve | tools */
    (function () {
      const mock = document.querySelector("#palette .mock");
      const feats = [...document.querySelectorAll("#palette .feat[data-feat]")];
      const featsWrap = document.querySelector("#palette .feats");
      if (!mock || !feats.length) return;
      const mockStage = document.querySelector("#palette .mock-stage");
      const navEl = document.querySelector("header");
      const secHeadEl = document.querySelector("#palette .sec-head");
      const press = document.getElementById("mockPress");
      const pressVal = document.getElementById("mockPressVal");
      const curvePos = document.getElementById("mockCurvePos");
      const curveNeg = document.getElementById("mockCurveNeg");
      const curveVal = document.getElementById("mockCurveVal");
      const toolName = document.getElementById("mockToolName");

      // 고정 헤더/섹션헤드/목업 스테이지 높이를 실측해 CSS 변수로 — 목업 sticky top 계산에 사용
      function setStickyVars() {
        const root = document.documentElement.style;
        if (navEl) root.setProperty("--nav-h", Math.round(navEl.getBoundingClientRect().height) + "px");
        if (secHeadEl) root.setProperty("--sec-h", Math.round(secHeadEl.getBoundingClientRect().height) + "px");
        if (mockStage) root.setProperty("--stage-h", Math.round(mockStage.getBoundingClientRect().height) + "px");
      }
      const isMobile = () => matchMedia("(max-width: 900px)").matches;
      const tools = document.querySelectorAll("#mockTools .mock-tool");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* 목업 설정값의 단일 소스 — 슬라이더 폭과 라벨은 항상 여기서 함께 그린다 */
      const tr = (key) => (STRINGS[document.documentElement.lang] || STRINGS.en)[key] || "";
      const PRESS_PRESETS = { soft: { w: 32, key: "pressSoft" }, std: { w: 50, key: "pressStandard" }, firm: { w: 74, key: "pressFirm" } };
      // 순서 = 목업 아이콘 순서 (연필 · 만년필 · 크레용 · 마커)
      const MOCK_TOOLS = [
        { nameKey: "mockToolPencil",   press: "std",  curve: 0 },
        { nameKey: "mockToolFountain", press: "soft", curve: 18 },
        { nameKey: "mockToolCrayon",   press: "firm", curve: -14 },
        { nameKey: "mockToolMarker",   press: "std",  curve: 32 },
      ];
      let toolIdx = 0;

      function setPress(preset) {
        press.style.width = PRESS_PRESETS[preset].w + "%";
        pressVal.textContent = tr(PRESS_PRESETS[preset].key);
      }
      // 커브는 중앙(0) 기준 양방향 게이지 — 0%면 눈금만 남는다
      function setCurve(v) {
        curvePos.style.width = (v > 0 ? v / 2 : 0) + "%";
        curveNeg.style.width = (v < 0 ? -v / 2 : 0) + "%";
        curveVal.textContent = (v > 0 ? "+" : "") + v + "%";
      }
      function applyMockTool(i) {
        toolIdx = i;
        const t = MOCK_TOOLS[i];
        tools.forEach((el, j) => el.classList.toggle("sel", j === i));
        toolName.textContent = tr(t.nameKey);
        setPress(t.press);
        setCurve(t.curve);
      }

      let toolTimer = null, pressTimer = null;
      function clearTimers() { clearInterval(toolTimer); clearInterval(pressTimer); toolTimer = pressTimer = null; }

      /* ── 메뉴바 클릭 인트로 (1회성 연출) ──
         목업이 화면에 들어오면: 커서가 앱 아이콘으로 이동 → 눌림 → 팔레트가 드롭.
         설명(feat)이 먼저 활성화되면 즉시 완료 상태로 점프해 하이라이트가 어긋나지 않게 한다. */
      const scene = document.querySelector("#palette .mock-scene");
      const mbApp = document.getElementById("mbApp");
      const cursor = document.getElementById("mockCursor");
      const clockEl = document.getElementById("mbClock");
      if (clockEl) {
        const now = new Date();
        clockEl.textContent = now.toLocaleDateString("en-US", { weekday: "short" }) + " " +
          now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
      }
      let introTimers = [], introDone = false, introPlaying = false;
      function clearIntroTimers() { introTimers.forEach(clearTimeout); introTimers = []; }
      function finishIntro() {
        if (introDone && !introPlaying) return;
        clearIntroTimers();
        introPlaying = false; introDone = true;
        scene.classList.add("is-open", "mb-pressed");
        scene.classList.remove("cursor-visible");
      }
      function playIntro() {
        if (introPlaying || introDone) return;
        if (reduce) { finishIntro(); return; }
        introPlaying = true;
        const s = scene.getBoundingClientRect();
        const i = mbApp.getBoundingClientRect();
        const tx = i.left - s.left + i.width / 2 - 5;   // 커서 끝점 보정
        const ty = i.top - s.top + i.height / 2 - 3;
        cursor.style.transition = "none";
        cursor.style.transform = `translate(${s.width * 0.55}px, 230px)`;
        scene.classList.add("cursor-visible");
        const at = (ms, fn) => introTimers.push(setTimeout(fn, ms));
        at(80,   () => { cursor.style.transition = ""; cursor.style.transform = `translate(${tx}px, ${ty}px)`; });
        at(880,  () => { scene.classList.add("mb-pressed"); cursor.style.transform = `translate(${tx}px, ${ty}px) scale(0.82)`; });
        at(1030, () => { cursor.style.transform = `translate(${tx}px, ${ty}px)`; scene.classList.add("is-open"); });
        at(1650, () => { scene.classList.remove("cursor-visible"); introPlaying = false; introDone = true; });
      }

      function activate(key) {
        if (key) finishIntro();   // 설명이 켜지는 순간엔 팔레트가 반드시 열려 있어야 한다
        clearTimers();
        mock.classList.remove("focus-tools", "focus-curve", "focus-mute", "is-focusing");
        applyMockTool(toolIdx);   // 애니메이션이 흔든 값 → 선택된 도구의 저장값으로 복원
        feats.forEach((f) => f.classList.toggle("is-active", f.dataset.feat === key));
        featsWrap.classList.toggle("has-active", !!key);
        if (!key) return;
        if (key === "tools") {
          mock.classList.add("focus-tools", "is-focusing");
          if (!reduce) {
            // 도구가 바뀌면 그 도구의 설정값(이름·감도·커브)도 함께 바뀐다
            const step = () => applyMockTool((toolIdx + 1) % MOCK_TOOLS.length);
            step();
            toolTimer = setInterval(step, 950);
          }
        } else if (key === "curve") {
          mock.classList.add("focus-curve", "is-focusing");
          if (!reduce) {
            // 감도만 움직인다 — 피치까지 같이 흔들면 산만해서 도구 저장값 그대로 둠
            let hi = true;
            const step = () => { setPress(hi ? "firm" : "soft"); hi = !hi; };
            step();
            pressTimer = setInterval(step, 900);
          }
        } else if (key === "mute") {
          mock.classList.add("focus-mute");
        }
      }

      // 활성화 기준선: 데스크톱은 뷰포트 중앙, 모바일은 고정된 목업 바로 아래
      // (읽고 있는 설명이 목업 밑으로 들어가기 직전에 켜지도록)
      const viewH = () => window.innerHeight || document.documentElement.clientHeight;
      function triggerY() {
        if (isMobile() && mockStage) {
          // 목업 아래 '읽는 영역'의 한가운데를 기준선으로 — 지금 읽는 설명이 활성화되도록
          const r = mockStage.getBoundingClientRect();
          return (r.bottom + viewH()) / 2;
        }
        return viewH() / 2;
      }
      let currentKey = null;
      // 목업 노출도에 따라 인트로 재생/초기화 — 스크롤 핸들러에서 함께 구동
      // (IntersectionObserver는 일부 임베드 환경에서 발화하지 않아 rect 기반으로 통일)
      function updateIntro() {
        if (!scene || !mockStage) return;
        const r = mockStage.getBoundingClientRect();
        const vh = viewH();
        const inView = r.top < vh * 0.8 && r.bottom > vh * 0.1;
        const fullyOut = r.bottom < 0 || r.top > vh;
        if (inView && currentKey === null) {
          if (!introDone && !introPlaying) playIntro();
        } else if (fullyOut && currentKey === null && !introPlaying && introDone) {
          // 완전히 벗어나면 닫아 두었다가 다음 진입 때 다시 연출
          introDone = false;
          scene.classList.remove("is-open", "mb-pressed", "cursor-visible");
        }
      }
      function update() {
        const line = triggerY();
        let best = null;
        for (const f of feats) {
          const r = f.getBoundingClientRect();
          if (r.top < line && r.bottom > line) { best = f; break; }
        }
        // 기준선이 어떤 설명 위에도 없으면 전부 해제 —
        // 홀드 뮤트 오버레이가 해당 문구를 읽을 때만 목업 위에 뜨도록
        const key = best ? best.dataset.feat : null;
        if (key !== currentKey) { currentKey = key; activate(key); }
        updateIntro();
      }
      window.addEventListener("scroll", update, { passive: true });
      window.addEventListener("resize", () => { setStickyVars(); update(); });
      window.addEventListener("load", () => { setStickyVars(); update(); });
      document.addEventListener("ffiblab:langchange", () => applyMockTool(toolIdx));
      setStickyVars();
      applyMockTool(0);   // 초기 목업 = 연필 설정
      update();
      window.__psIntro = { play: playIntro, finish: finishIntro };   // 디버깅용
      // 폰트 로딩 등으로 헤더 높이가 바뀔 수 있어 한 번 더 실측
      requestAnimationFrame(setStickyVars);
    })();
  </script>
</body>
</html>
